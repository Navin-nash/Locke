    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F8FAFC" letter-spacing="0.05em">EVIDENCE DOSSIER</text>
    <rect x="200" y="18" width="50" height="18" rx="9" fill="#064E3B"/>
    <text x="210" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#34D399">ACTIVE</text>

    <!-- Finding Rows -->
    <!-- Row 1: Org -->
    <g transform="translate(20, 74)">
      <circle cx="6" cy="6" r="5" fill="#10B981"/>
      <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Organization</text>
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#64748B">Confirmed • Crustdata API</text>
    </g>
    <!-- Row 2: Vacancy -->
    <g transform="translate(20, 124)">
      <circle cx="6" cy="6" r="5" fill="#10B981"/>
      <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Vacancy</text>
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#64748B">Matched • Ashby Board</text>
    </g>
    <!-- Row 3: Recruiter Affiliation -->
    <g transform="translate(20, 174)">
      <circle cx="6" cy="6" r="5" fill="#F59E0B"/>
      <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Recruiter Domain</text>
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#64748B">Lookalike • Needs check</text>
    </g>
    <!-- Row 4: Channel Resolution -->
    <g transform="translate(20, 224)">
      <circle cx="6" cy="6" r="5" fill="#10B981"/>
      <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Official Route</text>
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#2DD4BF">careers.acme.com/job/412</text>
    </g>

    <!-- Bottom Badge -->
    <rect x="20" y="290" width="230" height="46" rx="8" fill="#0D5C63"/>
    <text x="36" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Proceed via Safe Route →</text>
  </g>

  <!-- Footer Tag: neatHack 48h -->
  <text x="100" y="586" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#475569">
    neatHack 2026 • AI Investigator Agent Team
  </text>
</svg>
